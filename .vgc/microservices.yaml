# Microservices Architecture
# Complex distributed system with multiple service types and communication patterns

metadata:
  name: Microservices Architecture
  version: 2.0.0
  description: Complete microservices ecosystem with API gateway, services, caching, and message queue

nodeTypes:
  gateway:
    shape: rectangle
    color: '#00C853'
    icon: 'gateway'
    size:
      width: 140
      height: 70
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      instances:
        type: number
        required: false
    states:
      healthy:
        color: '#00C853'
        label: 'Healthy'
      degraded:
        color: '#F5A623'
        label: 'Degraded'
      down:
        color: '#D0021B'
        label: 'Down'
    sources:
      - 'services/gateway/**/*.ts'

  auth_service:
    shape: rectangle
    color: '#FF6B6B'
    icon: 'shield'
    size:
      width: 120
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    states:
      active:
        color: '#FF6B6B'
        label: 'Active'
      authenticating:
        color: '#F5A623'
        label: 'Auth'
    sources:
      - 'services/auth/**/*.ts'

  user_service:
    shape: rectangle
    color: '#4A90E2'
    icon: 'users'
    size:
      width: 120
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    sources:
      - 'services/user/**/*.ts'

  order_service:
    shape: rectangle
    color: '#9B59B6'
    icon: 'shopping-cart'
    size:
      width: 120
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    sources:
      - 'services/order/**/*.ts'

  payment_service:
    shape: rectangle
    color: '#E67E22'
    icon: 'credit-card'
    size:
      width: 120
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    sources:
      - 'services/payment/**/*.ts'

  cache:
    shape: circle
    color: '#3498DB'
    icon: 'bolt'
    size:
      width: 80
      height: 80
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      type:
        type: string
        required: false
    sources:
      - 'lib/cache/**/*.ts'

  message_queue:
    shape: diamond
    color: '#F39C12'
    icon: 'message'
    size:
      width: 90
      height: 90
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    sources:
      - 'lib/queue/**/*.ts'

  database:
    shape: circle
    color: '#27AE60'
    icon: 'database'
    size:
      width: 80
      height: 80
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      type:
        type: string
        required: false
    sources:
      - 'lib/database/**/*.ts'

edgeTypes:
  http_request:
    style: solid
    color: '#4A90E2'
    width: 2
    directed: true
    animated: true
    label:
      position: middle
    animation:
      type: flow
      duration: 1000
      color: '#4A90E2'

  grpc_call:
    style: solid
    color: '#7ED321'
    width: 3
    directed: true
    animated: false
    label:
      position: middle
    animation:
      type: flow
      duration: 600
      color: '#7ED321'

  message:
    style: dashed
    color: '#F39C12'
    width: 2
    directed: true
    animated: true
    label:
      position: middle
    animation:
      type: particle
      duration: 1500
      color: '#F39C12'

  cache_access:
    style: dotted
    color: '#3498DB'
    width: 2
    directed: true
    animated: false
    label:
      position: middle

  data_access:
    style: solid
    color: '#27AE60'
    width: 2
    directed: true
    animated: false
    label:
      position: middle

allowedConnections:
  - from: gateway
    to: auth_service
    via: http_request
  - from: gateway
    to: user_service
    via: http_request
  - from: gateway
    to: order_service
    via: http_request
  - from: auth_service
    to: cache
    via: cache_access
  - from: auth_service
    to: database
    via: data_access
  - from: user_service
    to: cache
    via: cache_access
  - from: user_service
    to: database
    via: data_access
  - from: order_service
    to: user_service
    via: grpc_call
  - from: order_service
    to: payment_service
    via: grpc_call
  - from: order_service
    to: message_queue
    via: message
  - from: payment_service
    to: database
    via: data_access
  - from: payment_service
    to: message_queue
    via: message

display:
  layout:
    type: hierarchical
    direction: top-to-bottom
  theme:
    background: '#F5F5F5'
    grid: true
