# Data Processing Pipeline
# ETL pipeline with ingestion, transformation, and storage stages

metadata:
  name: Data Processing Pipeline
  version: 1.0.0
  description: ETL pipeline for data ingestion, transformation, validation, and storage

nodeTypes:
  data_source:
    shape: rectangle
    color: '#6C5CE7'
    icon: 'file'
    size:
      width: 100
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      format:
        type: string
        required: false
    states:
      ready:
        color: '#6C5CE7'
        label: 'Ready'
      reading:
        color: '#F5A623'
        label: 'Reading'
      error:
        color: '#D0021B'
        label: 'Error'
    sources:
      - 'src/ingestion/**/*.ts'
      - 'src/sources/**/*.ts'

  validator:
    shape: diamond
    color: '#00B894'
    icon: 'check-circle'
    size:
      width: 90
      height: 90
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      rules:
        type: array
        required: false
    states:
      idle:
        color: '#00B894'
        label: 'Idle'
      validating:
        color: '#F5A623'
        label: 'Validating'
      failed:
        color: '#D0021B'
        label: 'Failed'
    sources:
      - 'src/validation/**/*.ts'

  transformer:
    shape: hexagon
    color: '#FD79A8'
    icon: 'transform'
    size:
      width: 100
      height: 100
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      type:
        type: string
        required: false
    states:
      idle:
        color: '#FD79A8'
        label: 'Idle'
      processing:
        color: '#F5A623'
        label: 'Processing'
    sources:
      - 'src/transformers/**/*.ts'
      - 'src/processors/**/*.ts'

  enricher:
    shape: hexagon
    color: '#FDCB6E'
    icon: 'plus-circle'
    size:
      width: 100
      height: 100
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    sources:
      - 'src/enrichment/**/*.ts'

  aggregator:
    shape: rectangle
    color: '#A29BFE'
    icon: 'layers'
    size:
      width: 110
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      window:
        type: string
        required: false
    sources:
      - 'src/aggregation/**/*.ts'

  data_warehouse:
    shape: circle
    color: '#0984E3'
    icon: 'database'
    size:
      width: 100
      height: 100
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      tables:
        type: array
        required: false
    sources:
      - 'src/storage/warehouse/**/*.ts'

  data_lake:
    shape: circle
    color: '#74B9FF'
    icon: 'archive'
    size:
      width: 100
      height: 100
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    sources:
      - 'src/storage/lake/**/*.ts'

  error_queue:
    shape: diamond
    color: '#D63031'
    icon: 'alert-circle'
    size:
      width: 80
      height: 80
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    sources:
      - 'src/errors/**/*.ts'

edgeTypes:
  data_flow:
    style: solid
    color: '#0984E3'
    width: 3
    directed: true
    animated: true
    label:
      position: middle
    animation:
      type: flow
      duration: 2000
      color: '#0984E3'

  validation_flow:
    style: solid
    color: '#00B894'
    width: 2
    directed: true
    animated: true
    label:
      position: middle
    animation:
      type: pulse
      duration: 1000
      color: '#00B894'

  error_flow:
    style: dashed
    color: '#D63031'
    width: 2
    directed: true
    animated: true
    label:
      position: middle
    animation:
      type: particle
      duration: 800
      color: '#D63031'

  storage_flow:
    style: solid
    color: '#6C5CE7'
    width: 2
    directed: true
    animated: false
    label:
      position: middle

allowedConnections:
  - from: data_source
    to: validator
    via: validation_flow
  - from: validator
    to: transformer
    via: data_flow
  - from: validator
    to: error_queue
    via: error_flow
  - from: transformer
    to: enricher
    via: data_flow
  - from: enricher
    to: aggregator
    via: data_flow
  - from: aggregator
    to: data_warehouse
    via: storage_flow
  - from: aggregator
    to: data_lake
    via: storage_flow
  - from: transformer
    to: error_queue
    via: error_flow
  - from: enricher
    to: error_queue
    via: error_flow

display:
  layout:
    type: hierarchical
    direction: left-to-right
  theme:
    background: '#FAFAFA'
    grid: true
