# Test Validation Graph
# Demonstrates validation rules and state transitions for testing

metadata:
  name: Test Validation
  version: 1.0.0
  description: Graph configuration for testing validation engine and state management

nodeTypes:
  test_runner:
    shape: rectangle
    color: '#2ECC71'
    icon: 'play'
    size:
      width: 120
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      suite:
        type: string
        required: false
    states:
      pending:
        color: '#95A5A6'
        label: 'Pending'
      running:
        color: '#F39C12'
        label: 'Running'
      passed:
        color: '#2ECC71'
        label: 'Passed'
      failed:
        color: '#E74C3C'
        label: 'Failed'
    sources:
      - 'tests/**/*.test.ts'
      - 'tests/**/*.spec.ts'
    actions:
      - pattern: 'Running test suite: (?<suiteName>.*)'
        event: 'test_started'
        state: 'running'
        metadata:
          suite: '$suiteName'
      - pattern: 'Test suite passed: (?<suiteName>.*)'
        event: 'test_completed'
        state: 'passed'
      - pattern: 'Test suite failed: (?<suiteName>.*) - (?<error>.*)'
        event: 'test_failed'
        state: 'failed'
        metadata:
          suite: '$suiteName'
          error: '$error'

  mock_service:
    shape: hexagon
    color: '#3498DB'
    icon: 'copy'
    size:
      width: 100
      height: 100
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      endpoints:
        type: array
        required: false
    states:
      ready:
        color: '#3498DB'
        label: 'Ready'
      responding:
        color: '#F39C12'
        label: 'Responding'
    sources:
      - 'tests/mocks/**/*.ts'

  assertion_engine:
    shape: diamond
    color: '#E67E22'
    icon: 'check'
    size:
      width: 90
      height: 90
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
    states:
      idle:
        color: '#E67E22'
        label: 'Idle'
      checking:
        color: '#F39C12'
        label: 'Checking'
      success:
        color: '#2ECC71'
        label: 'Success'
      failure:
        color: '#E74C3C'
        label: 'Failure'
    sources:
      - 'tests/assertions/**/*.ts'

  coverage_tracker:
    shape: rectangle
    color: '#9B59B6'
    icon: 'percent'
    size:
      width: 120
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      percentage:
        type: number
        required: false
    states:
      collecting:
        color: '#9B59B6'
        label: 'Collecting'
      complete:
        color: '#2ECC71'
        label: 'Complete'
    sources:
      - 'tests/coverage/**/*.ts'

  reporter:
    shape: rectangle
    color: '#1ABC9C'
    icon: 'file-text'
    size:
      width: 120
      height: 60
    dataSchema:
      name:
        type: string
        required: true
        displayInLabel: true
      format:
        type: string
        required: false
    states:
      idle:
        color: '#1ABC9C'
        label: 'Idle'
      generating:
        color: '#F39C12'
        label: 'Generating'
    sources:
      - 'tests/reporters/**/*.ts'

edgeTypes:
  test_execution:
    style: solid
    color: '#2ECC71'
    width: 2
    directed: true
    animated: true
    label:
      position: middle
    animation:
      type: flow
      duration: 1000
      color: '#2ECC71'
    activatedBy:
      - action: 'test_started'
        animation: 'flow'
        direction: 'forward'
        duration: 800

  mock_call:
    style: dashed
    color: '#3498DB'
    width: 2
    directed: true
    animated: false
    label:
      position: middle
    animation:
      type: particle
      duration: 600
      color: '#3498DB'

  assertion_check:
    style: solid
    color: '#E67E22'
    width: 2
    directed: true
    animated: true
    label:
      position: middle
    animation:
      type: pulse
      duration: 500
      color: '#E67E22'

  coverage_report:
    style: dotted
    color: '#9B59B6'
    width: 2
    directed: true
    animated: false
    label:
      position: middle

allowedConnections:
  - from: test_runner
    to: mock_service
    via: mock_call
    constraints:
      bidirectional: false
      maxInstances: 50
  - from: test_runner
    to: assertion_engine
    via: assertion_check
    constraints:
      bidirectional: false
      maxInstances: 100
  - from: test_runner
    to: coverage_tracker
    via: coverage_report
  - from: assertion_engine
    to: reporter
    via: test_execution
  - from: coverage_tracker
    to: reporter
    via: coverage_report

validation:
  rules:
    - type: connection_limit
      nodeType: test_runner
      maxOutgoing: 150
    - type: state_transition
      nodeType: test_runner
      allowedTransitions:
        pending: ['running']
        running: ['passed', 'failed']
        passed: []
        failed: []

display:
  layout:
    type: hierarchical
    direction: top-to-bottom
  theme:
    background: '#ECFOFF'
    grid: true
