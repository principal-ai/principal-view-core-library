# Component Library
# OTEL instrumentation configuration for this project.

version: "1.0.0"
name: "Visual Validation Components"
description: "OTEL instrumentation configuration"

# ─────────────────────────────────────────────
# Scopes
# Instrumentation scope definitions with colors and descriptions.
# Resources reference these by name in owned-scopes.
# ─────────────────────────────────────────────
scopes:
  principal-view.cli:
    description: "CLI tool instrumentation"
    color: "#6366F1"

# ─────────────────────────────────────────────
# Resources (OTel)
# Each resource is a separate process that emits telemetry.
# ─────────────────────────────────────────────
resources:
  pv-cli:
    service.name: "principal-view.cli"
    service.version: "${VERSION}"
    deployment.environment: "${ENVIRONMENT:-local}"
    owned-scopes:
      - "principal-view.cli"
