name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/react/showcase/**'
      - 'packages/react/.storybook-showcase/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (site)
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Build showcase storybook
        working-directory: packages/react
        env:
          STORYBOOK_BASE_PATH: /principal-view-core-library/examples/
        run: bun run build:showcase
      - name: Stage showcase into site
        run: |
          mkdir -p site/dist/examples
          cp -r packages/react/showcase-dist/. site/dist/examples/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
